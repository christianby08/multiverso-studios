<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecosistema — Multiverso Studios</title>
  <link rel="icon" type="image/png" href="imagenes/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="header"></div>

  <main>
    <section class="page-hero">
      <h1 class="reveal">¿Buscas algo diferente?</h1>
      <p class="reveal" style="font-size:1.2rem;margin-top:0.4rem">
        Explora otros de <span class="gradient-text">nuestros mundos.</span>
      </p>
    </section>

    <!-- 
      ECOSISTEMA — Cada tarjeta abre un sitio externo diferente.
      Cambia solo el "href" de cada <a> por la URL real.
      Ejemplo: href="https://tudominio.com"
    -->
    <div class="eco-grid">
      <a class="eco-card reveal" href="https://christianby08.github.io/Multiversal-Games/" target="_blank" rel="noopener">
        <div class="cover">
          <img src="imagenes/Games.png" alt="Vexo" />
        </div>
        <h3>Multiversal Games</h3>
        <p>Explora nuestros videojuegos</p>      
      <a class="eco-card reveal" href="https://christianby08.github.io/Vexo-Store/" target="_blank" rel="noopener">
        <div class="cover">
          <img src="imagenes/Vexo.png" alt="Vexo" />
        </div>
        <h3>Vexo</h3>
        <p>Tienda Oficial</p>
      </a>
      <a class="eco-card reveal" href="https://christianby08.github.io/Hevdex/" target="_blank" rel="noopener">
        <div class="cover">
          <img src="imagenes/Codexa.png" alt="Codexa" />
        </div>
        <h3>Hexdev</h3>
        <p>Diseño ideas. Diseño soluciones.</p>
      </a>
      <a class="eco-card reveal" href="https://christianby08.github.io/Vyzen-Team/" target="_blank" rel="noopener">
        <div class="cover">
          <img src="imagenes/Vyzen.png" alt="Vyzen Team" style="object-fit:cover" />
        </div>
        <h3>Vyzen Team</h3>
        <p>Equipo de E-Sports a nivel no profesional.</p>
      </a>
    </div>
  </main>

  <div id="footer"></div>
  <script src="script.js"></script>
</body>
</html>
